<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Account - Simpol</title>
  <link rel="stylesheet" href="./newaccut.css">
</head>

<body>
  <a href="../home/home.html">← Back to Home</a>
  <form id="newaccoutid" class="contaner">
    <h2>Create New Account</h2>
    <label for="fname">First Name:</label>
    <input id="fname" type="text" placeholder="Your first name">

    <label for="lname">Last Name:</label>
    <input id="lname" type="text" placeholder="Your last name">

    <label for="age">Age:</label>
    <input id="age" type="number" placeholder="Your age">

    <label for="email">Email:</label>
    <input id="email" type="email" placeholder="Enter your email">

    <label for="gender">Gender:</label>
    <input id="gender" type="text" placeholder="Your gender">

    <label for="country">Country:</label>
    <input id="country" type="text" placeholder="Where you live">

    <label for="pass">Password:</label>
    <input id="pass" type="password" placeholder="Enter your password">

    <label for="pass2">Confirm Password:</label>
    <input id="pass2" type="password" placeholder="Repeat your password">

    <button type="submit">Create Account</button>
  </form>
</body>

</html>
