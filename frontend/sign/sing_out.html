<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../home/home.css">
    <style>
        .signout-card {
            text-align: center;
            max-width: 400px;
            margin: 80px auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);

        .signout-card h1 {

            color: gray;

<body>
    <nav class="main-nav">
        <div class="nav-container">
            <a href="../home/home.html" class="logo">MY SITE</a>
            <button id="theme-toggle">Dark / Light</button>
            <ul class="nav-links">

        <div class="signout-card">
            <h1>👋 You are signed out</h1>
            <p>Thank you for using Simpol!</p>
            <br>
            <a href="./sing_in.html" class="but-search"
                style="text-decoration:none; padding: 10px 24px; background:#4a90e2; color:white; border-radius:8px;">Sign

        </div>

    <script>
        // Securely log out the user by clearing local storage
        localStorage.removeItem("user");
